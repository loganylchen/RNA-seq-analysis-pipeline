$schema: "http://json-schema.org/draft-06/schema#"

description: An entry in the sample sheet defining RNA-seq samples
type: object
properties:
  sample_name:
    type: string
    description: Unique sample name or identifier
  dataset_id:
    type: string
    description: Dataset source identifier (e.g., GEO accession, SRA project ID, or custom dataset name)
  dataset_type:
    type: string
    enum: ["discovery", "validation"]
    description: Dataset usage type - whether this dataset is used for discovery or validation analysis
  project_id:
    type: string
    description: Project identifier, should be string with [A-Za-z0-9]+
  condition:
    type: string
    description: Sample condition for differential expression analysis. For each project, only two conditions should exist (e.g., case/control, treatment/control, tumor/normal)
  patient:
    type: string
    description: Patient identifier. Multiple samples can come from the same patient
  raw_data:
    type: string
    description: SRA accession ID (e.g., SRRxxxxxx). If provided, data will be downloaded from SRA
  fq1:
    type: string
    description: Path to read1 fastq file
  fq2:
    type: string
    description: Path to read2 fastq file
  batch:
    type: string
    description: Batch identifier for batch effect correction
  seq_type:
    type: string
    enum: ["pe", "se"]
    description: Sequencing type: "pe" for paired-end, "se" for single-end
  # Pattern-based columns for additional clinical information
  # Any column starting with "info_b_" will be treated as binary/categorical
  # Any column starting with "info_c_" will be treated as continuous/numerical
required:
  - sample_name
  - project_id
  - dataset_id
  - condition
  - seq_type
  - dataset_type
